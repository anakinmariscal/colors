        </tr>
        <tr>
            <td class="orange">Orange</td>
            <td class="red-orange">Red Orange</td>
        </tr>
        <tr>
            <td class="yellow" rowspan="2">Yellow</td>
            <td class="purple">Purple</td>

        </tr>
        <tr>
            <td class="orange">Orange</td>
            <td class="red-orange">Red Orange</td>
        </tr>
        <tr>
            <td class="blue" rowspan="4">Blue</td>
            <td class="red" rowspan="2">Red</td>
            <td class="purple">Purple</td>
            <td class="blue-violet">Blue Violet</td>
        </tr>
        <tr>
            <td class="green">Green</td>
            <td class="teal">Teal</td>
        </tr>
        <tr>
            <td class="yellow" rowspan="2">Yellow</td>
            <td class="purple">Purple</td>
            <td class="blue-violet">Blue Violet</td>
        </tr>
        <tr>
            <td class="green">Green</td>
            <td class="teal">Teal</td>
        </tr>
        <tr>
            <td class="yellow" rowspan="4">Yellow</td>
            <td class="red" rowspan="2">Red</td>
            <td class="orange">Orange</td>
            <td class="amber">Yellow Orange</td>
        </tr>
        <tr>
            <td class="green">Green</td>
            <td class="yellow-green">Yellow Green</td>
        </tr>
        <tr>
            <td class="blue" rowspan="2">Blue</td>
            <td class="orange">Orange</td>
            <td class="amber">Yellow Orange</td>
        </tr>
        <tr>
            <td class="green">Green</td>
            <td class="yellow-green">Yellow Green</td>
        </tr>
    </table>

</html>
